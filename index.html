<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>snobweb — the web of your snobbiness</title>
  <script src="vendor/d3.v7.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f12;
      --surface:   #1a1a22;
      --border:    #2e2e3a;
      --accent:    #c9a96e;
      --accent2:   #8fa8d0;
      --text:      #e8e4dc;
      --muted:     #6b6880;
      --node-r:    38;
      --center-r:  52;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      color: var(--accent);
      flex-shrink: 0;
      font-style: italic;
    }

    .tagline {
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .search-area {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
      position: relative;
    }

    #search-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.45rem 0.8rem;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--muted); }

    #add-btn {
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #0f0f12;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      padding: 0.45rem 1rem;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    #add-btn:hover  { opacity: 0.85; }
    #add-btn:active { transform: scale(0.96); }
    #add-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

    /* Autocomplete dropdown */
    #suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    #suggestions li {
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.4rem 0.75rem;
      transition: background 0.1s;
    }
    #suggestions li:hover,
    #suggestions li.active { background: var(--border); }

    /* ── Canvas ──────────────────────────────────────────────── */
    #canvas {
      position: fixed;
      inset: 0;
      top: 53px; /* header height */
    }

    /* ── D3 elements ─────────────────────────────────────────── */
    .link {
      stroke: var(--border);
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
      stroke-opacity: 0.6;
    }

    .node-group { cursor: grab; }
    .node-group:active { cursor: grabbing; }

    .node-circle {
      stroke-width: 2;
      transition: filter 0.2s;
    }
    .node-group:hover .node-circle {
      filter: brightness(1.25);
    }

    .node-icon {
      font-size: 20px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
    }

    .node-label {
      fill: var(--text);
      font-family: 'Georgia', serif;
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: hanging;
      pointer-events: none;
      user-select: none;
    }

    .center-label {
      fill: var(--accent);
      font-family: 'Georgia', serif;
      font-size: 13px;
      font-style: italic;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
    }

    /* ── Empty state ─────────────────────────────────────────── */
    #empty-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      pointer-events: none;
      transition: opacity 0.4s;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Remove button on node ───────────────────────────────── */
    .remove-btn {
      fill: #c06060;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .node-group:hover .remove-btn { opacity: 0.9; }
    .remove-x {
      fill: var(--bg);
      font-size: 10px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .node-group:hover .remove-x { opacity: 1; }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--accent);
      font-size: 0.8rem;
      padding: 0.4rem 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <span class="brand">snobweb</span>
    <span class="tagline">the web of your snobbiness</span>
    <div class="search-area">
      <input
        id="search-input"
        type="text"
        placeholder="I'm a snob about…"
        autocomplete="off"
        spellcheck="false"
      />
      <ul id="suggestions"></ul>
      <button id="add-btn" disabled>Add</button>
    </div>
  </header>

  <svg id="canvas" width="100%" height="100%"></svg>

  <div id="empty-hint">
    Search for something you're a snob about and click <strong>Add</strong><br>
    to start weaving your web.
  </div>

  <div id="toast"></div>

  <script>
  (function () {
    'use strict';

    // ── Palette for nodes ──────────────────────────────────────
    const PALETTE = [
      '#c9a96e', '#8fa8d0', '#a8c8a0', '#d0a0a8',
      '#b0c0d8', '#d4b896', '#a0b8c8', '#c8b0d0',
      '#98c8a8', '#d0c098',
    ];

    // ── Suggested nouns with emoji icons ──────────────────────
    const SUGGESTIONS_LIST = [
      { label: 'coffee',          icon: '☕' },
      { label: 'wine',            icon: '🍷' },
      { label: 'whisky',          icon: '🥃' },
      { label: 'tea',             icon: '🍵' },
      { label: 'cheese',          icon: '🧀' },
      { label: 'olive oil',       icon: '🫒' },
      { label: 'bread',           icon: '🍞' },
      { label: 'chocolate',       icon: '🍫' },
      { label: 'pasta',           icon: '🍝' },
      { label: 'sushi',           icon: '🍣' },
      { label: 'eco-friendliness',icon: '♻️' },
      { label: 'sustainability',  icon: '🌱' },
      { label: 'minimalism',      icon: '◻️' },
      { label: 'simplicity',      icon: '✦' },
      { label: 'efficiency',      icon: '⚡' },
      { label: 'typography',      icon: '✍️' },
      { label: 'design',          icon: '🎨' },
      { label: 'architecture',    icon: '🏛️' },
      { label: 'natural fibers',  icon: '🧶' },
      { label: 'linen',           icon: '🧵' },
      { label: 'books',           icon: '📚' },
      { label: 'film',            icon: '🎬' },
      { label: 'music',           icon: '🎵' },
      { label: 'vinyl',           icon: '⚫' },
      { label: 'photography',     icon: '📷' },
      { label: 'cycling',         icon: '🚲' },
      { label: 'running',         icon: '🏃' },
      { label: 'yoga',            icon: '🧘' },
      { label: 'hiking',          icon: '🥾' },
      { label: 'grammar',         icon: '📝' },
      { label: 'punctuation',     icon: '•' },
      { label: 'fonts',           icon: 'Aa' },
      { label: 'notebooks',       icon: '📓' },
      { label: 'stationery',      icon: '✏️' },
      { label: 'pens',            icon: '🖊️' },
      { label: 'craft beer',      icon: '🍺' },
      { label: 'cocktails',       icon: '🍸' },
      { label: 'sourdough',       icon: '🥖' },
      { label: 'gardens',         icon: '🌿' },
      { label: 'ceramics',        icon: '🏺' },
      { label: 'leather goods',   icon: '👜' },
      { label: 'watches',         icon: '⌚' },
      { label: 'skincare',        icon: '✨' },
      { label: 'perfume',         icon: '🌸' },
      { label: 'espresso',        icon: '☕' },
      { label: 'matcha',          icon: '🍵' },
      { label: 'maps',            icon: '🗺️' },
      { label: 'travel',          icon: '✈️' },
      { label: 'food',            icon: '🍴' },
      { label: 'art',             icon: '🖼️' },
    ];

    // ── State ──────────────────────────────────────────────────
    const HEADER_H   = 53;
    const CENTER_ID  = 'center';
    let nodes = [{ id: CENTER_ID, label: 'me', isCenter: true, x: 0, y: 0 }];
    let links = [];
    let colorIndex = 0;

    // ── D3 Setup ───────────────────────────────────────────────
    const svgEl = document.getElementById('canvas');
    const svg = d3.select(svgEl);

    const gLinks = svg.append('g').attr('class', 'links-layer');
    const gNodes = svg.append('g').attr('class', 'nodes-layer');

    let width  = window.innerWidth;
    let height = window.innerHeight - HEADER_H;

    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(130).strength(0.4))
      .force('charge', d3.forceManyBody().strength(-320))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(55))
      .on('tick', ticked);

    // ── Resize ─────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      width  = window.innerWidth;
      height = window.innerHeight - HEADER_H;
      simulation.force('center', d3.forceCenter(width / 2, height / 2));
      simulation.alpha(0.2).restart();
    });

    // ── Render ─────────────────────────────────────────────────
    function update () {
      // Links
      const linkSel = gLinks.selectAll('.link').data(links, d => d.source.id + '-' + d.target.id);
      linkSel.enter()
        .append('line')
        .attr('class', 'link')
        .style('opacity', 0)
        .transition().duration(400)
        .style('opacity', 1);
      linkSel.exit()
        .transition().duration(300)
        .style('opacity', 0)
        .remove();

      // Nodes
      const nodeSel = gNodes.selectAll('.node-group').data(nodes, d => d.id);

      const nodeEnter = nodeSel.enter()
        .append('g')
        .attr('class', 'node-group')
        .style('opacity', 0)
        .call(drag(simulation));

      // Center node
      nodeEnter.filter(d => d.isCenter)
        .each(function () {
          const g = d3.select(this);
          g.append('circle')
            .attr('class', 'node-circle')
            .attr('r', 52)
            .attr('fill', '#1e1e2a')
            .attr('stroke', 'var(--accent)');
          g.append('text')
            .attr('class', 'center-label')
            .text('me');
        });

      // Regular nodes
      nodeEnter.filter(d => !d.isCenter)
        .each(function (d) {
          const g = d3.select(this);
          g.append('circle')
            .attr('class', 'node-circle')
            .attr('r', 38)
            .attr('fill', d.color + '22')
            .attr('stroke', d.color);
          g.append('text')
            .attr('class', 'node-icon')
            .attr('y', -4)
            .text(d.icon);
          g.append('text')
            .attr('class', 'node-label')
            .attr('y', 16)
            .text(d.label);
          // Remove button
          g.append('circle')
            .attr('class', 'remove-btn')
            .attr('r', 9)
            .attr('cx', 28)
            .attr('cy', -28)
            .on('click', (event, d) => { event.stopPropagation(); removeNode(d.id); });
          g.append('text')
            .attr('class', 'remove-x')
            .attr('x', 28)
            .attr('y', -28)
            .text('✕');
        });

      nodeEnter.transition().duration(400).style('opacity', 1);

      nodeSel.exit()
        .transition().duration(300)
        .style('opacity', 0)
        .remove();

      // Restart simulation
      simulation.nodes(nodes);
      simulation.force('link').links(links);
      simulation.alpha(0.5).restart();

      // Empty hint
      document.getElementById('empty-hint').style.opacity =
        nodes.length <= 1 ? '1' : '0';
    }

    function ticked () {
      gLinks.selectAll('.link')
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);

      gNodes.selectAll('.node-group')
        .attr('transform', d => `translate(${d.x},${d.y})`);
    }

    // ── Drag ───────────────────────────────────────────────────
    function drag (sim) {
      return d3.drag()
        .on('start', (event, d) => {
          if (!event.active) sim.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on('drag', (event, d) => {
          d.fx = event.x; d.fy = event.y;
        })
        .on('end', (event, d) => {
          if (!event.active) sim.alphaTarget(0);
          d.fx = null; d.fy = null;
        });
    }

    // ── Add / Remove ───────────────────────────────────────────
    function addNode (label) {
      label = label.trim().toLowerCase();
      if (!label) return;

      // Deduplicate
      if (nodes.find(n => n.label === label)) {
        showToast(`"${label}" is already in your web`);
        return;
      }

      const match = SUGGESTIONS_LIST.find(s => s.label === label);
      const icon  = match ? match.icon : '◆';
      const color = PALETTE[colorIndex % PALETTE.length];
      colorIndex++;

      const newNode = {
        id: 'node-' + Date.now(),
        label,
        icon,
        color,
        x: width  / 2 + (Math.random() - 0.5) * 160,
        y: height / 2 + (Math.random() - 0.5) * 160,
      };
      nodes.push(newNode);
      links.push({ source: CENTER_ID, target: newNode.id });

      update();
    }

    function removeNode (id) {
      nodes = nodes.filter(n => n.id !== id);
      links = links.filter(l => {
        const sid = typeof l.source === 'object' ? l.source.id : l.source;
        const tid = typeof l.target === 'object' ? l.target.id : l.target;
        return sid !== id && tid !== id;
      });
      update();
    }

    // ── Search / Autocomplete ──────────────────────────────────
    const searchInput  = document.getElementById('search-input');
    const addBtn       = document.getElementById('add-btn');
    const suggestionUl = document.getElementById('suggestions');

    let activeIdx = -1;

    function renderSuggestions (term) {
      suggestionUl.innerHTML = '';
      if (!term) { suggestionUl.style.display = 'none'; return; }

      const filtered = SUGGESTIONS_LIST
        .filter(s => s.label.includes(term.toLowerCase()))
        .slice(0, 8);

      if (filtered.length === 0) { suggestionUl.style.display = 'none'; return; }

      filtered.forEach((s, i) => {
        const li = document.createElement('li');
        li.textContent = s.icon + '  ' + s.label;
        li.dataset.label = s.label;
        li.addEventListener('mousedown', (e) => {
          e.preventDefault();
          searchInput.value = s.label;
          closeSuggestions();
          addBtn.disabled = false;
        });
        suggestionUl.appendChild(li);
      });

      activeIdx = -1;
      suggestionUl.style.display = 'block';
    }

    function closeSuggestions () {
      suggestionUl.style.display = 'none';
      activeIdx = -1;
    }

    searchInput.addEventListener('input', () => {
      const val = searchInput.value.trim();
      addBtn.disabled = val.length === 0;
      renderSuggestions(val);
    });

    searchInput.addEventListener('keydown', (e) => {
      const items = suggestionUl.querySelectorAll('li');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
        items.forEach((li, i) => li.classList.toggle('active', i === activeIdx));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, -1);
        items.forEach((li, i) => li.classList.toggle('active', i === activeIdx));
      } else if (e.key === 'Enter') {
        if (activeIdx >= 0 && items[activeIdx]) {
          searchInput.value = items[activeIdx].dataset.label;
          closeSuggestions();
          addBtn.disabled = false;
        } else {
          doAdd();
        }
      } else if (e.key === 'Escape') {
        closeSuggestions();
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-area')) closeSuggestions();
    });

    addBtn.addEventListener('click', doAdd);

    function doAdd () {
      const val = searchInput.value.trim();
      if (!val) return;
      addNode(val);
      searchInput.value = '';
      addBtn.disabled = true;
      closeSuggestions();
      searchInput.focus();
    }

    // ── Toast ──────────────────────────────────────────────────
    let toastTimer;
    function showToast (msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ── Bootstrap ─────────────────────────────────────────────
    // Center the initial node
    nodes[0].x = width  / 2;
    nodes[0].y = height / 2;
    nodes[0].fx = width  / 2;
    nodes[0].fy = height / 2;

    update();

    // Unpin center after a short moment so it can drift gently
    setTimeout(() => {
      nodes[0].fx = null;
      nodes[0].fy = null;
    }, 800);

  }());
  </script>
</body>
</html>
